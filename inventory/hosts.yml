# Inventory of the Atlas Industrie devices.
# Management addresses in VLAN 10 (10.42.0.0/24).
# Reservations: .1 virtual gateway, .2 and .3 the cores,
# .4 to .20 the other infrastructure devices.
sites:
A: Building A, head office and IT
B: Building B, production
hosts:
- {name: CC-A, role: core, site: A, mgmt: 10.42.0.2, loopback: 10.42.1.1}
- {name: CC-B, role: core, site: B, mgmt: 10.42.0.3, loopback: 10.42.1.2}
- {name: FW-A, role: firewall, site: A, mgmt: 10.42.0.4}
- {name: FW-B, role: firewall, site: B, mgmt: 10.42.0.5}
- {name: ACC-A-01, role: access, site: A, mgmt: 10.42.0.6}
- {name: ACC-A-02, role: access, site: A, mgmt: 10.42.0.7}
- {name: ACC-A-03, role: access, site: A, mgmt: 10.42.0.8}
- {name: ACC-A-04, role: access, site: A, mgmt: 10.42.0.9}
- {name: ACC-A-05, role: access, site: A, mgmt: 10.42.0.10}
- {name: ACC-A-06, role: access, site: A, mgmt: 10.42.0.11}
- {name: ACC-B-01, role: access, site: B, mgmt: 10.42.0.12}
- {name: ACC-B-02, role: access, site: B, mgmt: 10.42.0.13}
- {name: ACC-B-03, role: access, site: B, mgmt: 10.42.0.14}
- {name: ACC-B-04, role: access, site: B, mgmt: 10.42.0.15}
